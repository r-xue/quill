[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quill-sync"
version = "0.1.0"
description = "Query-based Unified Issue Lightweight Linker: Sync GitHub issues to an on-premise Jira instance (stateless)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rui Xue", email = "rx.astro@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyGithub>=2.3.0",
    "jira>=3.8.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser>=3.0",
    "sphinx-autodoc-typehints",
]

[project.scripts]
quill = "quill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ── Pixi ───────────────────────────────────────────────────────────────

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
pygithub = ">=2.3.0"
jira = ">=3.8.0"
pydantic-settings = ">=2.0.0"
rich = ">=13.0.0"
pytest = ">=7.0.0"
pytest-mock = ">=3.0.0"

[tool.pixi.pypi-dependencies]
quill-sync = { path = ".", editable = true }
sphinx = ">=7.0"
furo = "*"
myst-parser = ">=3.0"
sphinx-autodoc-typehints = "*"

[tool.pixi.tasks]
docs = { cmd = "sphinx-build -b html docs docs/_build/html", description = "Build Sphinx documentation" }
check = "quill check"
sync = "quill sync"
status = "quill status"
test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
